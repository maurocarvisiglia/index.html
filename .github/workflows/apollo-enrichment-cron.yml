name: Apollo enrichment daily cron

# Il cron nativo di Vercel (piano Hobby) non è garantito — "best effort", si è
# visto smettere di scattare per giorni senza errori visibili. GitHub Actions
# come programmatore esterno: chiama semplicemente l'endpoint via HTTP, non
# dipende dall'affidabilità del cron interno di Vercel.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  trigger-apollo-enrichment:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama l'endpoint di arricchimento Apollo
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://ls-job-intelligence.vercel.app/api/apollo-enrichment)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Apollo enrichment endpoint returned HTTP $http_code"
            exit 1
          fi
