name: Recupero prodotti daily cron

# Stesso motivo degli altri due workflow: il cron nativo di Vercel (Hobby) non è
# affidabile, GitHub Actions chiama l'endpoint dall'esterno indipendentemente.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  trigger-recupero-prodotti:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama l'endpoint di recupero prodotti
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://ls-job-intelligence.vercel.app/api/recupero-prodotti)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Recupero-prodotti endpoint returned HTTP $http_code"
            exit 1
          fi
