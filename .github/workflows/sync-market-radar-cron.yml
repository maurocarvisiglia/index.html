name: Sync Market Radar daily cron

# Stesso motivo degli altri workflow: il cron nativo di Vercel (Hobby) non è
# affidabile, GitHub Actions chiama l'endpoint dall'esterno indipendentemente.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

jobs:
  trigger-sync-market-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama l'endpoint di sync Market Radar
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST https://ls-job-intelligence.vercel.app/api/sync-market-radar)
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "HTTP status: $http_code"
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "::error::Sync-market-radar endpoint returned HTTP $http_code"
            exit 1
          fi
